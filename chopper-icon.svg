<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Chopper Motorcycle SVG -->
  <defs>
    <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Back Wheel -->
  <circle cx="25" cy="55" r="18" fill="none" stroke="url(#bikeGradient)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="25" cy="55" r="12" fill="none" stroke="url(#bikeGradient)" stroke-width="2"/>
  <circle cx="25" cy="55" r="4" fill="url(#bikeGradient)"/>
  
  <!-- Front Wheel -->
  <circle cx="95" cy="55" r="18" fill="none" stroke="url(#bikeGradient)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="95" cy="55" r="12" fill="none" stroke="url(#bikeGradient)" stroke-width="2"/>
  <circle cx="95" cy="55" r="4" fill="url(#bikeGradient)"/>
  
  <!-- Frame - Lower -->
  <line x1="25" y1="55" x2="50" y2="40" stroke="url(#bikeGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Seat -->
  <ellipse cx="45" cy="38" rx="15" ry="6" fill="url(#bikeGradient)" filter="url(#glow)"/>
  
  <!-- Frame - Upper to handlebars -->
  <line x1="50" y1="40" x2="80" y2="30" stroke="url(#bikeGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Front Fork -->
  <line x1="80" y1="30" x2="95" y2="55" stroke="url(#bikeGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Extended Front Fork (chopper style) -->
  <line x1="80" y1="30" x2="92" y2="20" stroke="url(#bikeGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <line x1="76" y1="28" x2="84" y2="28" stroke="url(#bikeGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="76" cy="28" r="3" fill="url(#bikeGradient)"/>
  <circle cx="84" cy="28" r="3" fill="url(#bikeGradient)"/>
  
  <!-- Rear Support -->
  <line x1="30" y1="55" x2="45" y2="38" stroke="url(#bikeGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Gas Tank -->
  <ellipse cx="55" cy="35" rx="12" ry="8" fill="url(#bikeGradient)" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Exhaust Pipes -->
  <line x1="35" y1="50" x2="20" y2="48" stroke="url(#bikeGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="53" x2="20" y2="51" stroke="url(#bikeGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Headlight -->
  <circle cx="92" cy="20" r="5" fill="#ffff00" opacity="0.9" filter="url(#glow)"/>
  <circle cx="92" cy="20" r="3" fill="#ffffff"/>
  
  <!-- Rear Light -->
  <circle cx="18" cy="48" r="3" fill="#ff0000" opacity="0.8"/>
</svg>