<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" width="140" height="90">
  <!-- ULTRA VISIBLE BLACK CHOPPER -->
  <defs>
    <filter id="strongShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff6b00" flood-opacity="1"/>
    </filter>
  </defs>
  
  <!-- Back Wheel - THICK BLACK -->
  <circle cx="30" cy="60" r="22" fill="#000000" stroke="#ff6b00" stroke-width="3" filter="url(#strongShadow)"/>
  <circle cx="30" cy="60" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="30" cy="60" r="14" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Spokes -->
  <line x1="30" y1="38" x2="30" y2="82" stroke="#ffffff" stroke-width="2"/>
  <line x1="8" y1="60" x2="52" y2="60" stroke="#ffffff" stroke-width="2"/>
  <line x1="14" y1="44" x2="46" y2="76" stroke="#ffffff" stroke-width="2"/>
  <line x1="46" y1="44" x2="14" y2="76" stroke="#ffffff" stroke-width="2"/>
  <circle cx="30" cy="60" r="6" fill="#ff6b00" stroke="#000000" stroke-width="2"/>
  
  <!-- Front Wheel - THICK BLACK -->
  <circle cx="110" cy="60" r="22" fill="#000000" stroke="#ff6b00" stroke-width="3" filter="url(#strongShadow)"/>
  <circle cx="110" cy="60" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="110" cy="60" r="14" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Spokes -->
  <line x1="110" y1="38" x2="110" y2="82" stroke="#ffffff" stroke-width="2"/>
  <line x1="88" y1="60" x2="132" y2="60" stroke="#ffffff" stroke-width="2"/>
  <line x1="94" y1="44" x2="126" y2="76" stroke="#ffffff" stroke-width="2"/>
  <line x1="126" y1="44" x2="94" y2="76" stroke="#ffffff" stroke-width="2"/>
  <circle cx="110" cy="60" r="6" fill="#ff6b00" stroke="#000000" stroke-width="2"/>
  
  <!-- Main Frame - ULTRA THICK BLACK -->
  <line x1="30" y1="60" x2="60" y2="45" stroke="#000000" stroke-width="8" stroke-linecap="round" filter="url(#strongShadow)"/>
  <line x1="60" y1="45" x2="90" y2="35" stroke="#000000" stroke-width="8" stroke-linecap="round" filter="url(#strongShadow)"/>
  
  <!-- Seat - BLACK with BRIGHT ORANGE -->
  <ellipse cx="55" cy="42" rx="22" ry="9" fill="#000000" stroke="#ff6b00" stroke-width="3" filter="url(#strongShadow)"/>
  
  <!-- Extended Front Fork - CHOPPER STYLE -->
  <line x1="90" y1="35" x2="105" y2="15" stroke="#000000" stroke-width="6" stroke-linecap="round" filter="url(#strongShadow)"/>
  <line x1="105" y1="15" x2="110" y2="60" stroke="#000000" stroke-width="6" stroke-linecap="round" filter="url(#strongShadow)"/>
  
  <!-- Handlebars - HIGH APE HANGERS -->
  <line x1="100" y1="10" x2="110" y2="10" stroke="#000000" stroke-width="4" stroke-linecap="round" filter="url(#strongShadow)"/>
  <line x1="100" y1="10" x2="98" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="10" x2="112" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="98" cy="20" r="4" fill="#ff6b00" stroke="#000000" stroke-width="2" filter="url(#strongShadow)"/>
  <circle cx="112" cy="20" r="4" fill="#ff6b00" stroke="#000000" stroke-width="2" filter="url(#strongShadow)"/>
  
  <!-- Gas Tank - BLACK with ORANGE -->
  <ellipse cx="68" cy="38" rx="18" ry="11" fill="#000000" stroke="#ff6b00" stroke-width="3" filter="url(#strongShadow)"/>
  <path d="M 54 38 Q 61 34, 68 38 T 82 38" fill="none" stroke="#ff6b00" stroke-width="2"/>
  
  <!-- Exhaust Pipes - THICK BLACK -->
  <line x1="40" y1="55" x2="18" y2="52" stroke="#000000" stroke-width="5" stroke-linecap="round" filter="url(#strongShadow)"/>
  <line x1="40" y1="59" x2="18" y2="56" stroke="#000000" stroke-width="5" stroke-linecap="round" filter="url(#strongShadow)"/>
  <circle cx="18" cy="52" r="3" fill="#ff6b00"/>
  <circle cx="18" cy="56" r="3" fill="#ff6b00"/>
  
  <!-- Headlight - SUPER BRIGHT -->
  <circle cx="105" cy="15" r="7" fill="#ffff00" stroke="#000000" stroke-width="2" filter="url(#strongShadow)"/>
  <circle cx="105" cy="15" r="5" fill="#ffffff"/>
  
  <!-- Rear Light -->
  <circle cx="16" cy="54" r="5" fill="#ff0000" stroke="#000000" stroke-width="2" filter="url(#strongShadow)"/>
  
  <!-- Rear Support Strut -->
  <line x1="35" y1="60" x2="50" y2="42" stroke="#000000" stroke-width="5" stroke-linecap="round" filter="url(#strongShadow)"/>
  
  <!-- License Plate -->
  <rect x="12" y="46" width="12" height="7" fill="#ffaa00" stroke="#000000" stroke-width="2"/>
  <text x="18" y="52" font-size="4" text-anchor="middle" fill="#000000" font-weight="bold">MK</text>
</svg>